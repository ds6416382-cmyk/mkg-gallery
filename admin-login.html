<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Admin Login | MKG Coaching Classes</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        135deg,
        #eef5ff,
        #dcecff
    );

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.login-box{

    width:100%;

    max-width:430px;

    background:white;

    padding:35px 25px;

    border-radius:25px;

    box-shadow:
    0 15px 40px #1233;

    text-align:center;

}

.logo{

    font-size:55px;

    margin-bottom:10px;

}

h1{

    color:#063b70;

    margin-bottom:8px;

}

.subtitle{

    color:#777;

    margin-bottom:30px;

    font-size:17px;

}

.input{

    width:100%;

    padding:16px;

    margin-bottom:15px;

    border:1px solid #ccd8e8;

    border-radius:12px;

    font-size:16px;

    outline:none;

}

.input:focus{

    border-color:#075da0;

}

.login-btn{

    width:100%;

    padding:16px;

    border:none;

    border-radius:12px;

    background:#075da0;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

}

.login-btn:disabled{

    opacity:.6;

}

.message{

    margin-top:20px;

    font-weight:bold;

    min-height:24px;

}

.error{

    color:#d00000;

}

.success{

    color:#08752c;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
🔐
</div>


<h1>
Admin Login
</h1>


<div class="subtitle">
MKG Coaching Classes
</div>


<input

type="email"

id="email"

class="input"

placeholder="Admin Email"

autocomplete="email"


>


<input

type="password"

id="password"

class="input"

placeholder="Password"

autocomplete="current-password"


>


<button

id="loginBtn"

class="login-btn"

onclick="adminLogin()"

>

🔑 Admin Login

</button>


<div
id="message"
class="message">

</div>


</div>



<script type="module">


/* =================================
   FIREBASE
================================= */

import { app }

from "./firebase.js";


import {

getAuth,
signInWithEmailAndPassword

}

from

"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";



/* =================================
   FIREBASE AUTH
================================= */

const auth =
getAuth(app);



/* =================================
   YOUR ADMIN UID
================================= */

const ADMIN_UID =
"SxkzVykLWudHhsqKSgGAKBgCbYW2";



/* =================================
   ELEMENTS
================================= */

const emailInput =
document.getElementById(
    "email"
);

const passwordInput =
document.getElementById(
    "password"
);

const loginBtn =
document.getElementById(
    "loginBtn"
);

const message =
document.getElementById(
    "message"
);



/* =================================
   ADMIN LOGIN
================================= */

window.adminLogin =
async function(){


    const email =
    emailInput.value.trim();


    const password =
    passwordInput.value;


    message.innerText = "";

    message.className =
    "message";


    if(!email){

        message.innerText =
        "⚠️ Email डालें।";

        message.classList.add(
            "error"
        );

        return;

    }


    if(!password){

        message.innerText =
        "⚠️ Password डालें।";

        message.classList.add(
            "error"
        );

        return;

    }


    loginBtn.disabled =
    true;

    loginBtn.innerText =
    "⏳ Login हो रहा है...";


    try{


        /* =========================
           FIREBASE LOGIN
        ========================= */

        const result =
        await signInWithEmailAndPassword(

            auth,

            email,

            password

        );


        const user =
        result.user;


        /* =========================
           ADMIN UID CHECK
        ========================= */

        if(
            user.uid !==
            ADMIN_UID
        ){

            await auth.signOut();

            throw new Error(
                "यह Account Admin नहीं है।"
            );

        }


        /* =========================
           SUCCESS
        ========================= */

        message.innerText =
        "✅ Admin Login Successful";


        message.classList.add(
            "success"
        );


        setTimeout(
        function(){

            window.location.href =
            "admin.html";

        },
        500
        );


    }

    catch(error){

        console.error(
            "Admin Login Error:",
            error
        );


        let errorMessage =
        "❌ Email या Password गलत है।";


        if(
            error.code ===
            "auth/user-not-found"
        ){

            errorMessage =
            "❌ यह Email Firebase में नहीं है।";

        }


        else if(
            error.code ===
            "auth/wrong-password"
        ){

            errorMessage =
            "❌ Password गलत है।";

        }


        else if(
            error.code ===
            "auth/invalid-credential"
        ){

            errorMessage =
            "❌ Email या Password गलत है।";

        }


        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            errorMessage =
            "⚠️ बहुत ज्यादा कोशिश हुई है। थोड़ी देर बाद फिर कोशिश करें।";

        }


        else if(
            error.message
        ){

            errorMessage =
            "❌ " +
            error.message;

        }


        message.innerText =
        errorMessage;


        message.classList.add(
            "error"
        );


        loginBtn.disabled =
        false;

        loginBtn.innerText =
        "🔑 Admin Login";

    }

};


</script>


</body>

</html>
