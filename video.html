<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Video Classes | MKG Coaching Classes</title>

<link rel="stylesheet" href="Style.css">

<style>

body{
    font-family:Poppins,sans-serif;
    background:#f5f7fb;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#0b3d91;
    margin-bottom:25px;
}

.video-list{
    max-width:1000px;
    margin:auto;
}

.video-card{

    background:#fff;

    padding:20px;

    margin:20px auto;

    border-radius:15px;

    box-shadow:
    0 5px 15px rgba(0,0,0,.15);
}

.video-card h2{
    color:#0b3d91;
    margin-bottom:8px;
}

.subject{
    color:#555;
    font-weight:bold;
    margin-bottom:15px;
}

iframe{

    width:100%;

    height:400px;

    border:none;

    border-radius:10px;

}

.watch-btn{

    display:inline-block;

    margin-top:15px;

    padding:11px 18px;

    background:#e50914;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;

}

.loading{

    text-align:center;

    padding:40px;

    color:#0b3d91;

    font-size:18px;

}

.no-video{

    background:white;

    padding:35px 20px;

    border-radius:15px;

    text-align:center;

    box-shadow:0 5px 15px rgba(0,0,0,.12);

}

.home{

    display:block;

    width:max-content;

    margin:25px auto;

    padding:12px 20px;

    background:#0b3d91;

    color:white;

    text-decoration:none;

    border-radius:8px;

    font-weight:bold;

}

@media(max-width:600px){

    body{
        padding:10px;
    }

    iframe{
        height:230px;
    }

}

</style>

</head>


<body>


<h1>
🎥 MKG Video Classes
</h1>


<div
id="videoList"
class="video-list">

<div class="loading">
⏳ Videos Loading...
</div>

</div>


<a
href="index.html"
class="home">

🏠 Home

</a>



<script type="module">


import { db }
from "./firebase.js";


import {

    collection,
    getDocs

}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



const videoList =
document.getElementById(
    "videoList"
);



async function loadVideos(){


    try{


        const snapshot =
        await getDocs(

            collection(
                db,
                "videos"
            )

        );


        videoList.innerHTML = "";


        const videos = [];


        snapshot.forEach(
        (item)=>{


            const data =
            item.data();


            /*
             * केवल Active Videos दिखाएँ
             */

            if(
                data.active === false
            ){

                return;

            }


            videos.push({

                id:item.id,

                ...data

            });

        });



        /*
         * Class 6 → 7 → 8 → ... 12
         */

        videos.sort(
        (a,b)=>{

            const classA =
            parseInt(
                a.className
            ) || 0;


            const classB =
            parseInt(
                b.className
            ) || 0;


            return classA-classB;

        });



        if(
            videos.length === 0
        ){

            videoList.innerHTML = `

                <div class="no-video">

                    <div style="
                        font-size:55px;
                    ">
                        🎥
                    </div>

                    <h2>
                        अभी कोई Video उपलब्ध नहीं है
                    </h2>

                    <p>
                        Admin Panel से Video Add करें।
                    </p>

                </div>

            `;

            return;

        }



        videos.forEach(
        (video)=>{


            const className =
            video.className ||
            "Class";


            const subject =
            video.subject ||
            "Video Class";


            const videoLink =
            video.videoLink ||
            "";


            const youtubeId =
            getYouTubeId(
                videoLink
            );



            const card =
            document.createElement(
                "div"
            );


            card.className =
            "video-card";



            let videoArea = "";



            if(youtubeId){


                videoArea = `

                    <iframe

                        src="https://www.youtube.com/embed/${youtubeId}"

                        title="${escapeHtml(subject)}"

                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"

                        allowfullscreen>

                    </iframe>

                `;


            }else{


                videoArea = `

                    <p style="
                        color:#dc3545;
                        font-weight:bold;
                    ">

                        ⚠️ YouTube Link सही नहीं है।

                    </p>

                `;

            }



            card.innerHTML = `

                <h2>

                    🎓 ${escapeHtml(className)}

                </h2>


                <div class="subject">

                    📚 ${escapeHtml(subject)}

                </div>


                ${videoArea}


                <a

                    href="${escapeHtml(videoLink)}"

                    target="_blank"

                    rel="noopener noreferrer"

                    class="watch-btn">

                    ▶ YouTube पर देखें

                </a>

            `;


            videoList.appendChild(
                card
            );

        });


    }

    catch(error){


        console.error(
            "Video Error:",
            error
        );


        videoList.innerHTML = `

            <div class="no-video">

                <div style="
                    font-size:55px;
                ">
                    ⚠️
                </div>

                <h2>
                    Videos Load नहीं हो पाए
                </h2>

                <p>
                    Firebase / Firestore में समस्या है।
                </p>

                <p style="
                    margin-top:12px;
                    color:#777;
                    font-size:12px;
                ">

                    ${escapeHtml(error.message)}

                </p>

            </div>

        `;

    }

}



/*
 * YouTube Video ID निकालना
 */

function getYouTubeId(url){

    if(!url){
        return null;
    }


    try{

        const parsed =
        new URL(url);


        /*
         * youtube.com/watch?v=XXXX
         */

        if(
            parsed.hostname.includes(
                "youtube.com"
            )
        ){

            if(
                parsed.pathname ===
                "/watch"
            ){

                return parsed.searchParams.get(
                    "v"
                );

            }


            /*
             * youtube.com/embed/XXXX
             */

            if(
                parsed.pathname.startsWith(
                    "/embed/"
                )
            ){

                return parsed.pathname
                    .split("/embed/")[1]
                    .split("/")[0];

            }


            /*
             * youtube.com/shorts/XXXX
             */

            if(
                parsed.pathname.startsWith(
                    "/shorts/"
                )
            ){

                return parsed.pathname
                    .split("/shorts/")[1]
                    .split("/")[0];

            }

        }


        /*
         * youtu.be/XXXX
         */

        if(
            parsed.hostname ===
            "youtu.be"
        ){

            return parsed.pathname
                .replace("/","")
                .split("/")[0];

        }


    }

    catch(error){

        return null;

    }


    return null;

}



/*
 * HTML Safety
 */

function escapeHtml(text){

    return String(text)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



loadVideos();


</script>


</body>

</html>
