<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MKG Coaching Classes | Courses</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins','Noto Sans Devanagari',sans-serif;
    min-height:100vh;
    color:#fff;
    padding:15px;

    background:
    radial-gradient(circle at 10% 10%,rgba(255,215,0,.16),transparent 28%),
    radial-gradient(circle at 90% 15%,rgba(0,150,255,.20),transparent 30%),
    radial-gradient(circle at 50% 100%,rgba(120,0,255,.18),transparent 35%),
    linear-gradient(135deg,#04101f,#08264a,#020817);
}

.course-header{
    max-width:1150px;
    margin:auto;
    text-align:center;
    padding:30px 10px 20px;
}

.logo-title{
    font-size:clamp(34px,8vw,68px);
    font-weight:900;
    line-height:1.1;
    letter-spacing:1px;
    color:#fff;

    text-shadow:
    0 4px 0 #174b9b,
    0 8px 20px rgba(0,0,0,.7);
}

.logo-title span{
    color:#FFD700;
}

.course-subtitle{
    margin-top:10px;
    font-size:clamp(15px,3vw,22px);
    font-weight:600;
    color:#e7f2ff;
}

.course-line{
    width:120px;
    height:5px;
    margin:17px auto;
    border-radius:20px;
    background:linear-gradient(90deg,#FFD700,#fff,#FFD700);
    box-shadow:0 0 18px rgba(255,215,0,.6);
}

.header-text{
    color:#b9d4ef;
    font-size:14px;
}

.course-grid{
    max-width:1150px;
    margin:25px auto 45px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:22px;
}

.course-card{
    position:relative;
    overflow:hidden;
    padding:25px 20px;
    text-align:center;
    border-radius:24px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.13),
        rgba(255,255,255,.035)
    );

    border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(14px);

    box-shadow:
    0 18px 45px rgba(0,0,0,.38),
    inset 0 1px 1px rgba(255,255,255,.12);

    transition:.35s ease;
}

.course-card:hover{
    transform:translateY(-8px);
}

.course-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    top:-90px;
    right:-90px;
    background:#FFD700;
    opacity:.09;
    border-radius:50%;
}

.course-icon{
    width:78px;
    height:78px;
    margin:0 auto 15px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:22px;
    font-size:35px;

    background:linear-gradient(145deg,#1769ff,#082e6d);

    border:1px solid rgba(255,255,255,.25);

    box-shadow:
    0 10px 25px rgba(0,0,0,.35),
    inset 0 1px 8px rgba(255,255,255,.2);
}

.course-card h2{
    font-size:23px;
    margin-bottom:8px;
    color:#fff;
}

.course-card h2 span{
    color:#FFD700;
}

.course-card p{
    color:#bfd2e7;
    font-size:13px;
    line-height:1.7;
    min-height:45px;
}

.badge{
    display:inline-block;
    margin:13px 0;
    padding:5px 13px;
    border-radius:20px;

    background:rgba(255,215,0,.12);
    color:#FFD700;
    border:1px solid rgba(255,215,0,.35);

    font-size:11px;
    font-weight:700;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.btn{
    min-height:44px;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

    border-radius:12px;
    text-decoration:none;

    font-size:13px;
    font-weight:700;

    transition:.25s ease;
}

.btn:hover{
    transform:scale(1.03);
}

.video-btn{
    color:#fff;
    background:linear-gradient(135deg,#e50914,#970007);
}

.pdf-btn{
    color:#fff;
    background:linear-gradient(135deg,#07835e,#04563e);
}

.join-btn{
    grid-column:1/-1;

    color:#06101f;

    background:
    linear-gradient(
        135deg,
        #FFD700,
        #fff18a,
        #FFD700
    );

    box-shadow:0 7px 18px rgba(255,215,0,.20);
}

.no-course{
    max-width:600px;
    margin:50px auto;
    padding:35px 20px;

    text-align:center;

    border-radius:25px;

    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);

    color:#c9d8e8;
}

.loading{
    text-align:center;
    padding:40px;
    color:#FFD700;
    font-size:18px;
}

.footer{
    max-width:900px;
    margin:20px auto;
    padding:20px;
    text-align:center;

    border-top:1px solid rgba(255,255,255,.12);

    color:#9bb3cc;
    font-size:13px;
}

.footer strong{
    color:#FFD700;
}

@media(max-width:600px){

    body{
        padding:9px;
    }

    .course-header{
        padding:25px 7px 15px;
    }

    .course-grid{
        grid-template-columns:1fr;
        gap:18px;
    }

    .course-card{
        padding:24px 18px;
    }
}

@media(max-width:360px){

    .buttons{
        grid-template-columns:1fr;
    }

    .join-btn{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<header class="course-header">

    <div class="logo-title">
        MKG <span>COACHING</span>
    </div>

    <div class="course-subtitle">
        🎓 गुणवत्तापूर्ण शिक्षा • बेहतर भविष्य
    </div>

    <div class="course-line"></div>

    <p class="header-text">
        Class 6th से Class 12th तक Online Courses
    </p>

</header>

<section class="course-grid" id="courseGrid">

    <div class="loading">
        ⏳ Courses Loading...
    </div>

</section>

<footer class="footer">

    © 2026
    <strong>MKG Coaching Classes</strong>

    <br>

    गुणवत्तापूर्ण शिक्षा • उज्जवल भविष्य

</footer>


<script type="module">

import { db } from "./firebase.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const courseGrid = document.getElementById("courseGrid");


const icons = {
    "6":"📚",
    "7":"📘",
    "8":"📗",
    "9":"📕",
    "10":"🎓",
    "11":"🧪",
    "12":"🏆"
};


const badges = {
    "6":"📖 Complete Notes",
    "7":"⭐ Study Material",
    "8":"🎯 Exam Preparation",
    "9":"🔥 Important Course",
    "10":"🏆 Board Preparation",
    "11":"💡 Concept Learning",
    "12":"🏆 Special Batch"
};


async function loadCourses(){

    try{

        const snapshot = await getDocs(
            collection(db,"courses")
        );


        const courses = [];


        snapshot.forEach((docSnap)=>{

            const data = docSnap.data();


            /*
             * Admin Panel में हमारा field:
             * active: true / false
             *
             * पुराने data में अगर status मौजूद हो
             * तो उसे भी support करेंगे।
             */

            const isActive =
                data.active === true ||
                data.status === "Active";


            if(!isActive){
                return;
            }


            courses.push({

                id: docSnap.id,

                ...data

            });

        });


        /*
         * Class 6 → 7 → 8 → ... 12
         */

        courses.sort((a,b)=>{

            return Number(a.className || 0)
                 - Number(b.className || 0);

        });


        courseGrid.innerHTML = "";


        if(courses.length === 0){

            courseGrid.innerHTML = `

                <div class="no-course">

                    <div style="font-size:60px;">
                        📚
                    </div>

                    <h2 style="margin:15px 0;color:#fff;">
                        अभी कोई Course उपलब्ध नहीं है
                    </h2>

                    <p>
                        Admin Panel से Course Add करें।
                    </p>

                </div>

            `;

            return;

        }


        courses.forEach((data)=>{


            const classNumber =
                data.className ||
                data.class ||
                data.name ||
                data.id;


            const classTitle =
                "Class " + classNumber + "th";


            const description =
                data.description ||
                "इस Course की पूरी जानकारी और Study Material उपलब्ध है।";


            /*
             * हमारे Admin Panel के सही fields
             */

            const video =
                data.videoUrl || "";


            const pdf =
                data.pdfUrl || "";


            const icon =
                icons[String(classNumber)] || "📚";


            const badge =
                badges[String(classNumber)] ||
                "📖 Study Material";


            let videoButton;


            if(video){

                videoButton = `

                    <a href="${video}"
                       class="btn video-btn"
                       target="_blank"
                       rel="noopener noreferrer">

                       ▶ Video

                    </a>

                `;

            }else{

                videoButton = `

                    <a href="#"
                       class="btn video-btn"
                       onclick="
                       alert('इस Course का Video अभी उपलब्ध नहीं है');
                       return false;
                       ">

                       ▶ Video

                    </a>

                `;

            }


            let pdfButton;


            if(pdf){

                pdfButton = `

                    <a href="${pdf}"
                       class="btn pdf-btn"
                       target="_blank"
                       rel="noopener noreferrer">

                       📄 PDF Notes

                    </a>

                `;

            }else{

                pdfButton = `

                    <a href="#"
                       class="btn pdf-btn"
                       onclick="
                       alert('इस Course की PDF अभी उपलब्ध नहीं है');
                       return false;
                       ">

                       📄 PDF Notes

                    </a>

                `;

            }


            const card =
                document.createElement("div");


            card.className =
                "course-card";


            card.innerHTML = `

                <div class="course-icon">

                    ${icon}

                </div>


                <h2>

                    Class
                    <span>${classNumber}th</span>

                </h2>


                <p>

                    ${description}

                </p>


                <div class="badge">

                    ${badge}

                </div>


                <div class="buttons">

                    ${videoButton}

                    ${pdfButton}


                    <a href="admission.html"
                       class="btn join-btn">

                       🚀 Join Course

                    </a>

                </div>

            `;


            courseGrid.appendChild(card);

        });


    }

    catch(error){

        console.error(
            "Courses Error:",
            error
        );


        courseGrid.innerHTML = `

            <div class="no-course">

                <div style="font-size:60px;">
                    ⚠️
                </div>


                <h2 style="color:#FFD700;margin:15px 0;">

                    Courses Load नहीं हो पाए

                </h2>


                <p>

                    Firebase connection या
                    Firestore में समस्या है।

                </p>


                <p style="
                    margin-top:15px;
                    font-size:12px;
                    color:#9bb3cc;
                ">

                    ${error.message}

                </p>

            </div>

        `;

    }

}


loadCourses();

</script>

</body>
</html>
