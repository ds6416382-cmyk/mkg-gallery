<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Online Admission | MKG Coaching Classes</title>

<link rel="stylesheet" href="style.css">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    padding:30px 15px 60px;

    background:
    radial-gradient(circle at 10% 10%,rgba(255,215,0,.18),transparent 25%),
    radial-gradient(circle at 90% 80%,rgba(0,130,255,.18),transparent 30%),
    linear-gradient(135deg,#031b35,#073e69,#02162c);

    color:#fff;
}

.admission-header{
    text-align:center;
    max-width:900px;
    margin:auto;
    padding:25px 10px 35px;
}

.admission-header h1{
    font-size:clamp(36px,8vw,65px);
    font-weight:900;

    text-shadow:
    0 5px 0 #174b73,
    0 12px 25px rgba(0,0,0,.7);
}

.admission-header h1 span{
    color:#FFD700;
}

.admission-header h2{
    margin-top:15px;
    color:#FFD700;
    font-size:clamp(22px,5vw,34px);
}

.gold-line{
    width:110px;
    height:5px;
    margin:20px auto;
    border-radius:20px;

    background:
    linear-gradient(90deg,#FFD700,#fff,#FFD700);

    box-shadow:0 0 20px rgba(255,215,0,.6);
}

.admission-card{
    max-width:700px;
    margin:auto;
    padding:40px 25px;
    text-align:center;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.18),
        rgba(255,255,255,.06)
    );

    border:1px solid rgba(255,255,255,.25);
    border-radius:30px;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
    18px 22px 45px rgba(0,0,0,.5),
    inset 0 1px 0 rgba(255,255,255,.25);
}

.form-icon{
    font-size:70px;
    margin-bottom:15px;
    filter:drop-shadow(0 8px 8px rgba(0,0,0,.5));
}

.admission-card h3{
    color:#FFD700;
    font-size:28px;
    margin-bottom:15px;
}

.admission-card p{
    font-size:18px;
    line-height:1.8;
    color:#fff;
}

.form-button{
    display:inline-block;
    margin-top:25px;
    padding:18px 35px;

    border-radius:18px;
    text-decoration:none;

    font-size:20px;
    font-weight:900;

    color:#06264b;

    background:
    linear-gradient(
        145deg,
        #ffe52b,
        #ffb900
    );

    box-shadow:
    0 8px 0 #a87900,
    0 18px 30px rgba(0,0,0,.45);

    transition:.3s;
}

.form-button:hover{
    transform:translateY(-6px) scale(1.03);

    box-shadow:
    0 14px 0 #a87900,
    0 25px 40px rgba(0,0,0,.55);
}

.contact-box{
    max-width:700px;
    margin:30px auto 0;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:18px;
}

.contact-item{
    padding:22px;
    text-align:center;

    border-radius:22px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.16),
        rgba(255,255,255,.05)
    );

    border:1px solid rgba(255,255,255,.2);

    box-shadow:
    10px 12px 25px rgba(0,0,0,.35);

    transition:.3s;
}

.contact-item:hover{
    transform:translateY(-7px);
}

.contact-item h3{
    color:#FFD700;
    margin-bottom:8px;
}

.contact-item a{
    color:#fff;
    font-weight:bold;
    text-decoration:none;
}

.home-button{
    display:inline-block;
    margin-top:30px;

    padding:14px 30px;

    border-radius:16px;

    color:#06264b;
    background:#fff;

    text-decoration:none;
    font-weight:900;

    box-shadow:
    0 8px 0 #9aaabd,
    0 15px 25px rgba(0,0,0,.4);

    transition:.25s;
}

.home-button:hover{
    transform:translateY(-5px);
}

@media(max-width:600px){

    body{
        padding:15px 10px 50px;
    }

    .admission-card{
        padding:30px 18px;
    }

    .form-button{
        width:100%;
        font-size:18px;
    }

    .contact-box{
        grid-template-columns:1fr;
    }

    .home-button{
        width:90%;
    }
}
</style>
</head>

<body>

target="_blank"
class="form-button">

📝 Fill Admission Form

</div>

</div>

</body>
</html>
