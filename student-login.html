<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login | MKG Coaching Classes</title>

<link rel="stylesheet" href="Style.css">

<style>
body{
font-family:Poppins,sans-serif;
background:#0b3d91;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.login-box{
background:white;
padding:30px;
border-radius:15px;
width:90%;
max-width:400px;
box-shadow:0 10px 25px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:#0b3d91;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#0b3d91;
color:white;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="login-box">

<h2>🎓 Student Login</h2>

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">
Login
</button>

</div>
<script type="module">

import { app } from "./firebase.js";

import {
getAuth,
signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const auth = getAuth(app);

document.getElementById("loginBtn").onclick = ()=>{

const email=document.getElementById("email").value;

const password=document.getElementById("password").value;

signInWithEmailAndPassword(auth,email,password)

.then(()=>{

alert("Login Successful");

window.location.replace("student-dashboard.html");

})

.catch((error)=>{

alert(error.message);

});

};

</script>
</body>
</html>
