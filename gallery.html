<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery | MKG Coaching Classes</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:linear-gradient(135deg,#031b35,#0b4c7d,#02162c);
padding:25px;
color:white;
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-size:55px;
font-weight:900;
text-shadow:0 6px 18px rgba(0,0,0,.6);
}

.header span{
color:#FFD700;
}

.header h2{
margin-top:15px;
color:#FFD700;
}

.header p{
margin-top:15px;
font-size:18px;
}

.gallery{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
}

.photo{
padding:12px;
border-radius:25px;
background:rgba(255,255,255,.12);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,.2);
box-shadow:0 15px 30px rgba(0,0,0,.45);
transition:.35s;
}

.photo:hover{
transform:translateY(-10px) scale(1.03);
}

.photo img{
width:100%;
height:240px;
object-fit:cover;
border-radius:18px;
}

.photo h3{
text-align:center;
margin-top:15px;
color:#FFD700;
}

.btn{
display:inline-block;
margin-top:35px;
padding:15px 35px;
background:linear-gradient(145deg,#FFD700,#ffb700);
color:#06264b;
text-decoration:none;
font-weight:900;
border-radius:16px;
box-shadow:0 10px 20px rgba(0,0,0,.45);
}

.bottom{
text-align:center;
}

@media(max-width:600px){

.header h1{
font-size:40px;
}

.btn{
width:90%;
}

}
</style>

</head>

<body>

<div class="header">

<h1>
MKG <span>COACHING CLASSES</span>
</h1>

<h2>📸 Photo Gallery</h2>

<p>
हमारी Coaching Classes की कुछ झलकियाँ
</p>

</div>

<div class="gallery">
Loading...
</div>

</div>

<div class="bottom">

<a href="index.html" class="btn">
🏠 Home Page
</a>

</div>
<script type="module">

import { db } from "./firebase.js";

import {
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const gallery=document.querySelector(".gallery");

async function loadGallery(){

gallery.innerHTML="";

try{

const snapshot=await getDocs(collection(db,"gallery"));

if(snapshot.empty){

gallery.innerHTML=`
<div class="photo">
<h3>अभी कोई Photo उपलब्ध नहीं है।</h3>
</div>
`;

return;

}

snapshot.forEach((photoDoc)=>{

const data=photoDoc.data();

const box=document.createElement("div");

box.className="photo";

box.innerHTML=`
<img src="${data.imageUrl}" alt="${data.title}">
<h3>${data.title}</h3>
`;

gallery.appendChild(box);

});

}catch(error){

console.error(error);

gallery.innerHTML=`
<div class="photo">
<h3>❌ Gallery Load नहीं हुई।</h3>
</div>
`;

}

}

loadGallery();

</script>
</body>
</html>
