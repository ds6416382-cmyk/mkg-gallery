<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery Upload | MKG Coaching Classes</title>

<link rel="stylesheet" href="Style.css">

</head>

<body>

<h1 style="text-align:center;margin-top:30px;">
📸 Gallery Upload
</h1>

<div class="card" style="max-width:600px;margin:30px auto;">

<h3>Photo Upload</h3>

<input
type="file"
id="photoFile"
accept="image/*">

<br><br>

<input
type="text"
id="photoTitle"
placeholder="Photo Title"
style="width:100%;padding:12px;border-radius:10px;">

<br><br>

<button
class="btn"
id="uploadPhoto">

📤 Upload Photo

</button>

</div>

<div class="card" style="max-width:700px;margin:30px auto;">

<h3>📋 Uploaded Photos</h3>

<div id="photoList">

Loading...

</div>

</div>

<p style="text-align:center;">

<a href="admin.html" class="btn">

⬅ Back to Admin Panel

</a>

</p>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const uploadBtn = document.getElementById("uploadPhoto");


uploadBtn.addEventListener("click", async () => {

  const file =
    document.getElementById("photoFile").files[0];

  const title =
    document.getElementById("photoTitle").value.trim();


  if (!file) {
    alert("पहले Photo चुनें।");
    return;
  }


  if (!title) {
    alert("Photo Title लिखें।");
    return;
  }


  try {

    const formData = new FormData();

    formData.append("file", file);

    formData.append(
      "upload_preset",
      "MKG gallery"
    );


    alert("📤 Photo Upload हो रहा है...");


    const response = await fetch(
      "https://api.cloudinary.com/v1_1/pa5iwcv8/image/upload",
      {
        method: "POST",
        body: formData
      }
    );


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error?.message ||
        "Cloudinary Upload Failed"
      );

    }


    const imageUrl = data.secure_url;


    await addDoc(
      collection(db, "gallery"),
      {
        title: title,
        imageUrl: imageUrl,
        publicId: data.public_id
      }
    );


    alert("✅ Photo Upload हो गया!");


    document.getElementById("photoFile").value = "";

    document.getElementById("photoTitle").value = "";


    loadPhotos();


  } catch (error) {

    console.error(error);

    alert("❌ " + error.message);

  }

});



async function loadPhotos() {

  const photoList =
    document.getElementById("photoList");


  photoList.innerHTML = "Loading...";


  try {

    const snapshot =
      await getDocs(collection(db, "gallery"));


    if (snapshot.empty) {

      photoList.innerHTML =
        "<p>अभी कोई Photo नहीं है।</p>";

      return;

    }


    photoList.innerHTML = "";


    snapshot.forEach((photoDoc) => {

      const data = photoDoc.data();


      const box =
        document.createElement("div");


      box.className = "card";

      box.style.marginBottom = "15px";


      box.innerHTML = `

        <img
          src="${data.imageUrl}"
          style="
            width:100%;
            max-height:220px;
            object-fit:cover;
            border-radius:10px;
          "
        >

        <h3>${data.title}</h3>

      `;


      const deleteBtn =
        document.createElement("button");


      deleteBtn.className = "btn";

      deleteBtn.style.background = "#dc3545";

      deleteBtn.textContent = "🗑 Delete";


      deleteBtn.onclick = async () => {

        if (
          confirm(
            "क्या यह Photo Gallery से Delete करना चाहते हैं?"
          )
        ) {

          try {

            await deleteDoc(
              doc(
                db,
                "gallery",
                photoDoc.id
              )
            );


            alert(
              "✅ Photo Gallery से Delete हो गया"
            );


            loadPhotos();


          } catch (error) {

            console.error(error);

            alert(
              "❌ Delete Failed"
            );

          }

        }

      };


      box.appendChild(deleteBtn);

      photoList.appendChild(box);

    });


  } catch (error) {

    console.error(error);

    photoList.innerHTML =
      "<p>❌ Gallery Load नहीं हुई।</p>";

  }

}


loadPhotos();

</script>

</body>
</html>
