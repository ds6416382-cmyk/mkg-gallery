<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gallery Upload | MKG Coaching Classes</title>

<link rel="stylesheet" href="Style.css">

</head>

<body>

<h1 style="text-align:center;margin-top:30px;">
📸 Gallery Upload
</h1>

<div class="card" style="max-width:600px;margin:30px auto;">

<h3>Photo Upload</h3>

<input
type="file"
id="photoFile"
accept="image/*">

<br><br>

<input
type="text"
id="photoTitle"
placeholder="Photo Title"
style="width:100%;padding:12px;border-radius:10px;">

<br><br>

<button
class="btn"
id="uploadPhoto">

📤 Upload Photo

</button>

</div>

<div class="card" style="max-width:700px;margin:30px auto;">

<h3>📋 Uploaded Photos</h3>

<div id="photoList">

Loading...

</div>

</div>

<p style="text-align:center;">

<a href="admin.html" class="btn">

⬅ Back to Admin Panel

</a>

</p>

<script type="module">

import { app, db, storage } from "./firebase.js";

import {

getStorage,
ref,
uploadBytes,
getDownloadURL,
deleteObject

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";

import {

collection,
addDoc,
getDocs,
deleteDoc,
doc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const uploadBtn = document.getElementById("uploadPhoto");

uploadBtn.addEventListener("click", async () => {
alert("Button Working");
const file = document.getElementById("photoFile").files[0];
const title = document.getElementById("photoTitle").value.trim();
alert(file ? file.name : "No File");
alert(title);
if(!file){
alert("पहले Photo चुनें।");
return;
}

if(!title){
alert("Photo Title लिखें।");
return;
}

try{

const imageRef = ref(storage,"gallery/"+Date.now()+"_"+file.name);

alert("Uploading Start");

await uploadBytes(imageRef,file);

alert("Upload Complete");

const imageUrl = await getDownloadURL(imageRef);

alert("Saving Data");
await addDoc(collection(db,"gallery"),{

title:title,

imageUrl:imageUrl,

imagePath:imageRef.fullPath

});

alert("✅ Photo Upload हो गया!");

document.getElementById("photoFile").value="";
document.getElementById("photoTitle").value="";

loadPhotos();

}catch(error){

console.error(error);

alert(error.message);

}

});

async function loadPhotos(){

const photoList=document.getElementById("photoList");

photoList.innerHTML="";
try{

const snapshot = await getDocs(collection(db,"gallery"));

if(snapshot.empty){

photoList.innerHTML="<p>अभी कोई Photo नहीं है।</p>";

return;

}

snapshot.forEach((photoDoc)=>{

const data=photoDoc.data();

const box=document.createElement("div");

box.className="card";

box.style.marginBottom="15px";

box.innerHTML=`
<img src="${data.imageUrl}"
style="width:100%;max-height:220px;object-fit:cover;border-radius:10px;">

<h3>${data.title}</h3>
`;

const deleteBtn=document.createElement("button");

deleteBtn.className="btn";

deleteBtn.style.background="#dc3545";

deleteBtn.textContent="🗑 Delete";

deleteBtn.onclick=async()=>{

if(confirm("क्या यह Photo Delete करना चाहते हैं?")){

try{

const imageRef=ref(storage,data.imagePath);

await deleteObject(imageRef);

await deleteDoc(doc(db,"gallery",photoDoc.id));

alert("✅ Photo Delete हो गया");

loadPhotos();

}catch(error){

console.error(error);

alert("❌ Delete Failed");

}

}

};

box.appendChild(deleteBtn);

photoList.appendChild(box);

});

}catch(error){

console.error(error);

photoList.innerHTML="<p>❌ Gallery Load नहीं हुई।</p>";

}

}

loadPhotos();

</script>

</body>
</html>
