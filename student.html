<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Student Management | MKG Coaching Classes</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef5ff;
    color:#123;
}

.header{
    background:linear-gradient(135deg,#032b55,#075da0);
    color:white;
    padding:25px 15px;
    text-align:center;
}

.header h1{
    color:#ffd000;
    margin-bottom:8px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
}

.top-buttons{
    text-align:center;
    margin-bottom:20px;
}

.btn{
    display:inline-block;
    border:none;
    padding:12px 18px;
    border-radius:10px;
    color:white;
    background:#075da0;
    text-decoration:none;
    font-weight:bold;
    cursor:pointer;
    margin:4px;
    font-size:15px;
}

.back{
    background:#555;
}

.approve{
    background:#08a94f;
}

.reject{
    background:#d90000;
}

.refresh{
    background:#ffb900;
    color:#062e58;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.copy{
    background:#6c4bc4;
    color:white;
}

.status{
    text-align:center;
    font-weight:bold;
    margin:15px 0;
    line-height:1.8;
}

.student-card{
    background:white;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 8px 25px #1232;
}

.student-card h2{
    color:#063b70;
    margin-bottom:12px;
    font-size:26px;
}

.info{
    line-height:1.9;
    color:#444;
    font-size:17px;
}

.photo{
    width:180px;
    height:220px;
    object-fit:cover;
    border-radius:15px;
    border:4px solid #ffd000;
    margin-bottom:15px;
    display:block;
}

.badge{
    display:inline-block;
    padding:6px 12px;
    border-radius:20px;
    background:#fff0b0;
    color:#765900;
    font-weight:bold;
}

.approved-badge{
    background:#d8ffe8;
    color:#08752c;
}

.rejected-badge{
    background:#ffe0e0;
    color:#b00000;
}

.no-data{
    background:white;
    padding:30px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 5px 20px #1232;
    line-height:1.8;
}

.actions{
    margin-top:18px;
}

</style>

</head>


<body>


<!-- =================================
     HEADER
================================= -->

<div class="header">

<h1>👨‍🎓 Student Management</h1>

<p>MKG Coaching Classes Admin Panel</p>

</div>



<div class="container">


<!-- =================================
     TOP BUTTONS
================================= -->

<div class="top-buttons">

<a
href="admin.html"
class="btn back">

⬅️ Admin Panel

</a>


<button
class="btn refresh"
onclick="loadStudents()">

🔄 Refresh

</button>

</div>



<!-- =================================
     STATUS
================================= -->

<div
id="status"
class="status">

⏳ Students Loading...

</div>



<!-- =================================
     STUDENTS LIST
================================= -->

<div id="studentsList"></div>


</div>



<script type="module">


/* =================================
   FIREBASE
================================= */

import { db }
from "./firebase.js";


import {

collection,
getDocs,
doc,
updateDoc,
query,
orderBy

}
from
"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";



/* =================================
   ELEMENTS
================================= */

const studentsList =
document.getElementById(
    "studentsList"
);


const status =
document.getElementById(
    "status"
);



/* =================================
   LOAD STUDENTS
================================= */

window.loadStudents =
async function(){

    studentsList.innerHTML = "";

    status.innerText =
    "⏳ Students Loading...";


    try{


        const studentsQuery =
        query(

            collection(
                db,
                "studentRegistrations"
            ),

            orderBy(
                "createdAt",
                "desc"
            )

        );


        const snapshot =
        await getDocs(
            studentsQuery
        );


        if(snapshot.empty){

            status.innerText = "";

            studentsList.innerHTML = `

                <div class="no-data">

                    👨‍🎓 अभी कोई Student Registration नहीं है।

                    <br><br>

                    Student Registration होने के बाद
                    यहाँ दिखाई देगा।

                </div>

            `;

            return;

        }



        let total = 0;
        let pending = 0;
        let approved = 0;
        let rejected = 0;



        snapshot.forEach(
        function(docSnap){


            const data =
            docSnap.data();


            total++;


            const studentStatus =
            data.status || "pending";



            if(studentStatus === "pending"){
                pending++;
            }


            if(studentStatus === "approved"){
                approved++;
            }


            if(studentStatus === "rejected"){
                rejected++;
            }



            /* =========================
               STATUS
            ========================= */

            let statusBadge = "";
            let badgeClass = "badge";


            if(studentStatus === "approved"){

                statusBadge =
                "🟢 Approved";

                badgeClass +=
                " approved-badge";

            }

            else if(studentStatus === "rejected"){

                statusBadge =
                "🔴 Rejected";

                badgeClass +=
                " rejected-badge";

            }

            else{

                statusBadge =
                "⏳ Pending";

            }



            /* =========================
               PHOTO
            ========================= */

            let photoHTML = "";


            if(data.photoURL){

                photoHTML = `

                    <img

                        src="${escapeHTML(
                            data.photoURL
                        )}"

                        class="photo"

                        alt="Student Photo"

                        onerror="
                            this.style.display='none';
                        "

                    >

                `;

            }



            /* =========================
               BUTTONS
            ========================= */

            let buttons = "";



            /* ---------- PENDING ---------- */

            if(studentStatus === "pending"){

                buttons = `

                    <button

                        class="btn approve"

                        onclick="approveStudent('${docSnap.id}')">

                        ✅ Approve

                    </button>


                    <button

                        class="btn reject"

                        onclick="rejectStudent('${docSnap.id}')">

                        ❌ Reject

                    </button>

                `;

            }



            /* ---------- APPROVED ---------- */

            if(studentStatus === "approved"){

                const studentId =
                data.studentId || "";

                const whatsappNumber =
                data.whatsapp ||
                data.mobile ||
                "";


                buttons = `

                    <button

                        class="btn whatsapp"

                        onclick="sendWhatsApp(
                            '${escapeJS(whatsappNumber)}',
                            '${escapeJS(data.studentName || "Student")}',
                            '${escapeJS(studentId)}'
                        )">

                        📲 WhatsApp पर ID भेजें

                    </button>


                    <button

                        class="btn copy"

                        onclick="copyStudentID(
                            '${escapeJS(studentId)}'
                        )">

                        📋 ID Copy

                    </button>


                    <button

                        class="btn reject"

                        onclick="rejectStudent('${docSnap.id}')">

                        ❌ Reject

                    </button>

                `;

            }



            /* =========================
               STUDENT CARD
            ========================= */

            studentsList.innerHTML += `

                <div class="student-card">

                    ${photoHTML}


                    <h2>

                        👨‍🎓

                        ${escapeHTML(
                            data.studentName ||
                            "-"
                        )}

                    </h2>


                    <div class="info">


                        📱 <strong>Mobile:</strong>

                        ${escapeHTML(
                            data.mobile ||
                            "-"
                        )}

                        <br>


                        💬 <strong>WhatsApp:</strong>

                        ${escapeHTML(
                            data.whatsapp ||
                            "-"
                        )}

                        <br>


                        🎓 <strong>Class:</strong>

                        ${escapeHTML(
                            data.studentClass ||
                            "-"
                        )}

                        <br>


                        🆔 <strong>Student ID:</strong>

                        <strong>

                            ${escapeHTML(
                                data.studentId ||
                                "Approval के बाद मिलेगा"
                            )}

                        </strong>

                        <br>


                        📌 <strong>Status:</strong>

                        <span
                            class="${badgeClass}">

                            ${statusBadge}

                        </span>


                    </div>


                    <div class="actions">

                        ${buttons}

                    </div>


                </div>

            `;


        });



        /* =========================
           COUNTS
        ========================= */

        status.innerHTML = `

            👨‍🎓 Total:
            <strong>${total}</strong>

            &nbsp; | &nbsp;

            ⏳ Pending:
            <strong>${pending}</strong>

            &nbsp; | &nbsp;

            🟢 Approved:
            <strong>${approved}</strong>

            &nbsp; | &nbsp;

            🔴 Rejected:
            <strong>${rejected}</strong>

        `;


    }


    catch(error){

        console.error(
            "Student Load Error:",
            error
        );


        status.innerText =
        "❌ Students Load Error";


        studentsList.innerHTML = `

            <div class="no-data">

                ❌ Student Data Load नहीं हो पाया।

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

};



/* =================================
   APPROVE STUDENT
================================= */

window.approveStudent =
async function(studentDocId){


    const confirmApprove =
    confirm(
        "क्या इस Student को Approve करना है?"
    );


    if(!confirmApprove){

        return;

    }


    try{


        const studentId =
        generateStudentID();


        await updateDoc(

            doc(
                db,
                "studentRegistrations",
                studentDocId
            ),

            {

                status:
                "approved",

                studentId:
                studentId

            }

        );


        alert(

            "✅ Student Approved!\n\n" +

            "🆔 Student ID: " +

            studentId +

            "\n\n" +

            "अब WhatsApp button से Student को ID भेज सकते हैं।"

        );


        loadStudents();

    }


    catch(error){

        console.error(
            "Approval Error:",
            error
        );


        alert(

            "❌ Approval Error\n\n" +

            error.message

        );

    }

};



/* =================================
   REJECT STUDENT
================================= */

window.rejectStudent =
async function(studentDocId){


    const confirmReject =
    confirm(
        "क्या इस Student Registration को Reject करना है?"
    );


    if(!confirmReject){

        return;

    }


    try{


        await updateDoc(

            doc(
                db,
                "studentRegistrations",
                studentDocId
            ),

            {

                status:
                "rejected"

            }

        );


        alert(
            "❌ Student Registration Rejected"
        );


        loadStudents();

    }


    catch(error){

        console.error(
            "Reject Error:",
            error
        );


        alert(

            "❌ Reject Error\n\n" +

            error.message

        );

    }

};



/* =================================
   GENERATE STUDENT ID
================================= */

function generateStudentID(){

    const randomNumber =

        Math.floor(

            100000 +

            Math.random() *

            900000

        );


    return "MKG" +
           randomNumber;

}



/* =================================
   WHATSAPP MESSAGE
================================= */

function createWhatsAppMessage(
    studentName,
    studentId
){

    return `🎉 MKG Coaching Classes

प्रिय ${studentName},

आपका Student Registration सफलतापूर्वक Approved हो गया है।

🆔 Student ID:
${studentId}

🔐 Password:
Registration के समय बनाया हुआ अपना Password इस्तेमाल करें।

अब आप Student Login करके अपने Notes, PDF और Videos देख सकते हैं।

धन्यवाद 🙏

MKG Coaching Classes`;

}



/* =================================
   WHATSAPP
================================= */

window.sendWhatsApp =
function(
    number,
    studentName,
    studentId
){

    let cleanNumber =
    String(number || "")
    .replace(/\D/g,"");


    /* =========================
       INDIA NUMBER
    ========================= */

    if(cleanNumber.length === 10){

        cleanNumber =
        "91" +
        cleanNumber;

    }


    if(cleanNumber.length !== 12){

        alert(
            "❌ सही WhatsApp Number उपलब्ध नहीं है।"
        );

        return;

    }



    /* =========================
       MESSAGE
    ========================= */

    const message =
    createWhatsAppMessage(
        studentName,
        studentId
    );


    const encodedMessage =
    encodeURIComponent(
        message
    );



    /* =========================
       HTTPS WHATSAPP LINK
       whatsapp:// इस्तेमाल नहीं होगा
    ========================= */

    const whatsappURL =
        "https://api.whatsapp.com/send" +
        "?phone=" +
        cleanNumber +
        "&text=" +
        encodedMessage;



    /* =========================
       OPEN
    ========================= */

    window.location.href =
    whatsappURL;

};



/* =================================
   COPY STUDENT ID
================================= */

window.copyStudentID =
async function(studentId){

    if(!studentId){

        alert(
            "❌ Student ID उपलब्ध नहीं है।"
        );

        return;

    }


    try{

        await navigator.clipboard.writeText(
            studentId
        );


        alert(
            "✅ Student ID Copy हो गई:\n\n" +
            studentId
        );

    }

    catch(error){

        alert(
            "🆔 Student ID:\n\n" +
            studentId
        );

    }

};



/* =================================
   HTML SECURITY
================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =================================
   JAVASCRIPT STRING SECURITY
================================= */

function escapeJS(value){

    return String(value)

        .replace(
            /\\/g,
            "\\\\"
        )

        .replace(
            /'/g,
            "\\'"
        )

        .replace(
            /"/g,
            '\\"'
        )

        .replace(
            /\n/g,
            "\\n"
        )

        .replace(
            /\r/g,
            "\\r"
        );

}



/* =================================
   START
================================= */

loadStudents();


</script>


</body>

</html>
